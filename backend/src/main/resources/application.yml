server:
  port: ${PORT:8080}

spring:
  application:
    name: cafeflow-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5433/cafeflow}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:Saiteja1939}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    repair-on-migrate: true
    locations: classpath:db/migration
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5433/cafeflow}}
    user: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:Saiteja1939}}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# Custom Security Configurations
cafeflow:
  jwt:
    # 512-bit secure secret key
    secret: 9a6140ba86518a4a58066f7f2b1d6b83f06b997321e05a5a1f6a1e8a4a2f8b5f3a6140ba86518a4a58066f7f2b1d6b83f06b997321e05a5a1f6a1e8a4a2f8b5f
    expiration-ms: 86400000 # 24 hours
  otp:
    expiry-minutes: 5
    resend-cooldown-seconds: 30
    max-attempts: 5
  upload:
    dir: uploads/products/
  file-serving:
    base-url: http://localhost:8080/uploads/products/

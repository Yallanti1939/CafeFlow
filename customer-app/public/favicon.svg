<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1C14"/>
      <stop offset="100%" stop-color="#140A07"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#B77945"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Dark Circle Badge -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
  
  <!-- Inner Gold Emblem Badge -->
  <circle cx="50" cy="50" r="34" fill="url(#goldGrad)"/>
  
  <!-- Coffee Cup SVG Icon -->
  <g transform="translate(24, 25) scale(2.15)" stroke="#140A07" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Steam Lines -->
    <path d="M6 3 C 5 4, 7 5, 6 6" stroke="#FFFFFF" stroke-width="1.5" opacity="0.95"/>
    <path d="M10 2 C 9 3.5, 11 4.5, 10 6" stroke="#FFFFFF" stroke-width="1.5" opacity="0.95"/>
    <path d="M14 3 C 13 4, 15 5, 14 6" stroke="#FFFFFF" stroke-width="1.5" opacity="0.95"/>
    <!-- Coffee Cup Body -->
    <path d="M18 8H4v7a4 4 0 0 0 4 4h8a4 4 0 0 0 4-4V8Z" fill="#FFFFFF"/>
    <!-- Cup Handle -->
    <path d="M18 8h1a3 3 0 0 1 3 3v0a3 3 0 0 1-3 3h-1" stroke="#FFFFFF" stroke-width="2"/>
  </g>
</svg>
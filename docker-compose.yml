version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cafeflow-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: cafeflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
